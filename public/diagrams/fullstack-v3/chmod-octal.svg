<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 280" role="img" aria-labelledby="chmod-octal-title chmod-octal-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="chmod-octal-title">Reading chmod 644</title>
  <desc id="chmod-octal-desc">Each digit of a chmod number is one audience: owner, group and everyone else. Read is worth four, write two and execute one, and the digit is their sum. Six is read plus write; four is read only.</desc>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="40" y="44" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">chmod 644 authorized_keys</text>
  <text x="104" y="86" fill="#9d4cfa" font-size="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">6</text>
  <text x="104" y="108" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em" text-anchor="middle">OWNER</text>
  <rect x="40" y="120" width="128" height="104" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <rect x="56" y="137" width="14" height="14" rx="3" fill="#9d4cfa" stroke="#9d4cfa" stroke-width="1"/>
  <text x="82" y="148" fill="#171717" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">r</text>
  <text x="152" y="148" fill="#9d4cfa" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">4</text>
  <rect x="56" y="165" width="14" height="14" rx="3" fill="#9d4cfa" stroke="#9d4cfa" stroke-width="1"/>
  <text x="82" y="176" fill="#171717" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">w</text>
  <text x="152" y="176" fill="#9d4cfa" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">2</text>
  <rect x="56" y="193" width="14" height="14" rx="3" fill="none" stroke="#c4c4c8" stroke-width="1"/>
  <text x="82" y="204" fill="#c4c4c8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">x</text>
  <text x="152" y="204" fill="#c4c4c8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">1</text>
  <text x="304" y="86" fill="#9d4cfa" font-size="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">4</text>
  <text x="304" y="108" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em" text-anchor="middle">GROUP</text>
  <rect x="240" y="120" width="128" height="104" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <rect x="256" y="137" width="14" height="14" rx="3" fill="#9d4cfa" stroke="#9d4cfa" stroke-width="1"/>
  <text x="282" y="148" fill="#171717" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">r</text>
  <text x="352" y="148" fill="#9d4cfa" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">4</text>
  <rect x="256" y="165" width="14" height="14" rx="3" fill="none" stroke="#c4c4c8" stroke-width="1"/>
  <text x="282" y="176" fill="#c4c4c8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">w</text>
  <text x="352" y="176" fill="#c4c4c8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">2</text>
  <rect x="256" y="193" width="14" height="14" rx="3" fill="none" stroke="#c4c4c8" stroke-width="1"/>
  <text x="282" y="204" fill="#c4c4c8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">x</text>
  <text x="352" y="204" fill="#c4c4c8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">1</text>
  <text x="504" y="86" fill="#9d4cfa" font-size="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">4</text>
  <text x="504" y="108" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em" text-anchor="middle">OTHERS</text>
  <rect x="440" y="120" width="128" height="104" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <rect x="456" y="137" width="14" height="14" rx="3" fill="#9d4cfa" stroke="#9d4cfa" stroke-width="1"/>
  <text x="482" y="148" fill="#171717" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">r</text>
  <text x="552" y="148" fill="#9d4cfa" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">4</text>
  <rect x="456" y="165" width="14" height="14" rx="3" fill="none" stroke="#c4c4c8" stroke-width="1"/>
  <text x="482" y="176" fill="#c4c4c8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">w</text>
  <text x="552" y="176" fill="#c4c4c8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">2</text>
  <rect x="456" y="193" width="14" height="14" rx="3" fill="none" stroke="#c4c4c8" stroke-width="1"/>
  <text x="482" y="204" fill="#c4c4c8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">x</text>
  <text x="552" y="204" fill="#c4c4c8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">1</text>
  <text x="40" y="256" fill="#171717" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">Read 4, write 2, execute 1. Each digit is just their sum.</text>
</svg>
