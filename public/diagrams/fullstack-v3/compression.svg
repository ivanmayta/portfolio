<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 216" role="img" aria-labelledby="compression-title compression-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="compression-title">Compression is re-description</title>
  <desc id="compression-desc">A run of bits written out in full takes fourteen characters. Described as counts of repeated values it takes far fewer, and nothing is lost.</desc>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="24" y="56" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">THE FILE</text>
  <text x="24" y="90" fill="#171717" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.08em">00001110100000</text>
  <text x="24" y="132" fill="#9d4cfa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">THE SAME FILE, DESCRIBED</text>
  <text x="24" y="166" fill="#9d4cfa" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.08em">4×0 3×1 1×0 1×1 5×0</text>
  <text x="24" y="200" fill="#171717" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">Nothing is thrown away. It is written differently, and it unpacks exactly.</text>
</svg>
