<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 280" role="img" aria-labelledby="git-loop-dark-title git-loop-dark-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="git-loop-dark-title">Getting off the server</title>
  <desc id="git-loop-dark-desc">You edit on your own machine with your usual tools, push to GitHub, and pull down onto the server. The repository sits in the middle so the server stops being the place you write code.</desc>
  <defs><marker id="git-loop-dark-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker></defs>
  <rect width="100%" height="100%" fill="#0c0c0e"/>
  <path d="M 176 116 L 244 116" stroke="#a1a1aa" stroke-width="1" marker-end="url(#git-loop-dark-a)"/>
  <rect x="180" y="92" width="60" height="14" rx="2" fill="#0c0c0e"/>
  <text x="210" y="103" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">git push</text>
  <path d="M 396 116 L 464 116" stroke="#a1a1aa" stroke-width="1" marker-end="url(#git-loop-dark-a)"/>
  <rect x="400" y="92" width="60" height="14" rx="2" fill="#0c0c0e"/>
  <text x="430" y="103" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">git pull</text>
  <path d="M 552 148 L 552 180 Q 552 188 544 188 L 112 188 Q 104 188 104 180 L 104 152" fill="none" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#git-loop-dark-a)"/>
  <rect x="236" y="164" width="184" height="14" rx="2" fill="#0c0c0e"/>
  <text x="328" y="175" fill="#3f3f46" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">the first push came from here</text>
  <rect x="16" y="84" width="160" height="64" rx="6" fill="rgba(157,76,250,0.14)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="96" y="108" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">your laptop</text>
  <text x="96" y="125" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">your real editor</text>
  <rect x="248" y="84" width="144" height="64" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="320" y="108" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">GitHub</text>
  <text x="320" y="125" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">origin</text>
  <rect x="464" y="84" width="160" height="64" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="544" y="108" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">your server</text>
  <text x="544" y="125" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">pull and restart</text>
  <text x="16" y="252" fill="#ededed" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">The repo in the middle is what lets you stop editing over SSH.</text>
</svg>
