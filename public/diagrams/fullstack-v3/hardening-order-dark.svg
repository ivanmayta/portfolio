<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 320" role="img" aria-labelledby="hardening-order-dark-title hardening-order-dark-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="hardening-order-dark-title">Hardening a fresh server, in order</title>
  <desc id="hardening-order-dark-desc">Six steps in a fixed order: update packages, reboot, create a sudo user, install your public key, log in as that user to prove it works, and only then disable root login. Step five is the check that must pass before step six.</desc>
  <defs><marker id="hardening-order-dark-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker></defs>
  <rect width="100%" height="100%" fill="#0c0c0e"/>
  <rect x="16" y="64" width="176" height="60" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="104" y="88" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">1  update</text>
  <text x="104" y="105" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">apt update &amp;&amp; upgrade</text>
  <rect x="232" y="64" width="176" height="60" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="320" y="88" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">2  reboot</text>
  <text x="320" y="105" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">shutdown -r now</text>
  <rect x="448" y="64" width="176" height="60" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="536" y="88" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">3  new user</text>
  <text x="536" y="105" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">adduser + sudo group</text>
  <rect x="16" y="184" width="176" height="60" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="104" y="208" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">4  add your key</text>
  <text x="104" y="225" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">~/.ssh/authorized_keys</text>
  <rect x="232" y="184" width="176" height="60" rx="6" fill="rgba(157,76,250,0.14)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="320" y="208" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">5  log in as them</text>
  <text x="320" y="225" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">prove it works first</text>
  <rect x="448" y="184" width="176" height="60" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="536" y="208" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">6  disable root</text>
  <text x="536" y="225" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">PermitRootLogin no</text>
  <path d="M 192 94 L 224 94" stroke="#a1a1aa" stroke-width="1" marker-end="url(#hardening-order-dark-a)"/>
  <path d="M 192 214 L 224 214" stroke="#a1a1aa" stroke-width="1" marker-end="url(#hardening-order-dark-a)"/>
  <path d="M 408 94 L 440 94" stroke="#a1a1aa" stroke-width="1" marker-end="url(#hardening-order-dark-a)"/>
  <path d="M 408 214 L 440 214" stroke="#a1a1aa" stroke-width="1" marker-end="url(#hardening-order-dark-a)"/>
  <path d="M 536 124 L 536 148 Q 536 156 528 156 L 112 156 Q 104 156 104 164 L 104 180" fill="none" stroke="#a1a1aa" stroke-width="1" marker-end="url(#hardening-order-dark-a)"/>
  <path d="M 296 250 L 296 258 L 384 258 L 384 250" fill="none" stroke="#9d4cfa" stroke-width="1"/>
  <text x="340" y="274" fill="#9d4cfa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">the gate</text>
  <text x="16" y="302" fill="#ededed" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">Skip step five and step six locks you out for good. Delete the server, start over.</text>
</svg>
