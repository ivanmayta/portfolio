<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 296" role="img" aria-labelledby="http-vs-websocket-title http-vs-websocket-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="http-vs-websocket-title">HTTP against a WebSocket</title>
  <desc id="http-vs-websocket-desc">An HTTP request opens a connection, gets a response and closes, so the server cannot speak first. A WebSocket upgrades once and the connection stays open, letting either side send at any time.</desc>
  <defs><marker id="http-vs-websocket-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker></defs>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="24" y="56" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em">HTTP</text>
  <rect x="24" y="68" width="100" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="74" y="91" fill="#171717" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">browser</text>
  <rect x="192" y="68" width="100" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="242" y="91" fill="#171717" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">server</text>
  <path d="M 74 104 L 74 244" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <path d="M 242 104 L 242 244" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <path d="M 74 140 L 238 140" stroke="#52525b" stroke-width="1" marker-end="url(#http-vs-websocket-a)"/>
  <rect x="56" y="121" width="204" height="13" rx="2" fill="#fafafa"/>
  <text x="158" y="131" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">GET /</text>
  <path d="M 242 176 L 78 176" stroke="#52525b" stroke-width="1" marker-end="url(#http-vs-websocket-a)"/>
  <rect x="56" y="157" width="204" height="13" rx="2" fill="#fafafa"/>
  <text x="158" y="167" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">200 + body</text>
  <path d="M 74 212 L 238 212" stroke="#c4c4c8" stroke-width="1" marker-end="url(#http-vs-websocket-a)"/>
  <rect x="56" y="193" width="204" height="13" rx="2" fill="#fafafa"/>
  <text x="158" y="203" fill="#c4c4c8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">…and again for the next thing</text>
  <text x="24" y="266" fill="#52525b" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif">The server can never speak first.</text>
  <text x="344" y="56" fill="#9d4cfa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em">WEBSOCKET</text>
  <rect x="344" y="68" width="100" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="394" y="91" fill="#171717" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">browser</text>
  <rect x="512" y="68" width="100" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="562" y="91" fill="#171717" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">server</text>
  <path d="M 394 104 L 394 244" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <path d="M 562 104 L 562 244" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <path d="M 394 140 L 558 140" stroke="#52525b" stroke-width="1" marker-end="url(#http-vs-websocket-a)"/>
  <rect x="376" y="121" width="204" height="13" rx="2" fill="#fafafa"/>
  <text x="478" y="131" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">GET / + Upgrade</text>
  <path d="M 562 176 L 398 176" stroke="#52525b" stroke-width="1" marker-end="url(#http-vs-websocket-a)"/>
  <rect x="376" y="157" width="204" height="13" rx="2" fill="#fafafa"/>
  <text x="478" y="167" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">101 switching protocols</text>
  <path d="M 562 212 L 398 212" stroke="#9d4cfa" stroke-width="1" marker-end="url(#http-vs-websocket-a)"/>
  <rect x="376" y="193" width="204" height="13" rx="2" fill="#fafafa"/>
  <text x="478" y="203" fill="#9d4cfa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">anything, any time</text>
  <text x="344" y="266" fill="#171717" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Both sides, until someone leaves.</text>
</svg>
