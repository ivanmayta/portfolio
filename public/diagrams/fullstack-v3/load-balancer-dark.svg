<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 280" role="img" aria-labelledby="load-balancer-dark-title load-balancer-dark-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="load-balancer-dark-title">One upstream, many containers</title>
  <desc id="load-balancer-dark-desc">nginx proxies to a named upstream rather than a single port. The upstream lists every container, and nginx decides which one takes each request.</desc>
  <defs><marker id="load-balancer-dark-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker></defs>
  <rect width="100%" height="100%" fill="#0c0c0e"/>
  <text x="16" y="52" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em">upstream nodebackend</text>
  <path d="M 176 132 L 272 132" stroke="#a1a1aa" stroke-width="1"/>
  <path d="M 280 76 L 280 212" stroke="#a1a1aa" stroke-width="1"/>
  <path d="M 280 76 L 368 76" stroke="#a1a1aa" stroke-width="1" marker-end="url(#load-balancer-dark-a)"/>
  <rect x="376" y="52" width="248" height="48" rx="6" fill="rgba(157,76,250,0.14)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="396" y="80" fill="#ededed" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600">container 1</text>
  <text x="604" y="80" fill="#a1a1aa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">localhost:3000</text>
  <path d="M 280 144 L 368 144" stroke="#a1a1aa" stroke-width="1" marker-end="url(#load-balancer-dark-a)"/>
  <rect x="376" y="120" width="248" height="48" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="396" y="148" fill="#ededed" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600">container 2</text>
  <text x="604" y="148" fill="#a1a1aa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">localhost:3001</text>
  <path d="M 280 212 L 368 212" stroke="#a1a1aa" stroke-width="1" marker-end="url(#load-balancer-dark-a)"/>
  <rect x="376" y="188" width="248" height="48" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="396" y="216" fill="#ededed" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600">container 3</text>
  <text x="604" y="216" fill="#a1a1aa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">localhost:3002</text>
  <rect x="16" y="100" width="160" height="64" rx="6" fill="rgba(157,76,250,0.14)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="96" y="124" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">nginx</text>
  <text x="96" y="141" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">picks one</text>
  <text x="16" y="252" fill="#ededed" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">Round robin by default. Least connections costs a measurement.</text>
</svg>
