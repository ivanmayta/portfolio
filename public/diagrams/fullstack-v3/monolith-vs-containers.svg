<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 264" role="img" aria-labelledby="monolith-vs-containers-title monolith-vs-containers-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="monolith-vs-containers-title">A monolith against containers</title>
  <desc id="monolith-vs-containers-desc">One server running nginx, node and a database together must restart as a unit. The same pieces in separate containers can be updated and replaced one at a time without taking the site down.</desc>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="16" y="52" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em">ONE SERVER, ONE BLOCK</text>
  <rect x="16" y="64" width="288" height="152" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <rect x="36" y="84" width="248" height="32" rx="4" fill="#fafafa" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <text x="52" y="105" fill="#52525b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">nginx</text>
  <rect x="36" y="128" width="248" height="32" rx="4" fill="#fafafa" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <text x="52" y="149" fill="#52525b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">node</text>
  <rect x="36" y="172" width="248" height="32" rx="4" fill="#fafafa" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <text x="52" y="193" fill="#52525b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sqlite</text>
  <text x="16" y="240" fill="#52525b" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Restart one thing, everything blinks.</text>
  <text x="336" y="52" fill="#9d4cfa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em">ONE CONTAINER EACH</text>
  <rect x="336" y="64" width="288" height="44" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="356" y="91" fill="#171717" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">nginx</text>
  <text x="604" y="91" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">its own OS layer</text>
  <rect x="336" y="116" width="288" height="44" rx="6" fill="rgba(157,76,250,0.08)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="356" y="143" fill="#171717" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">node</text>
  <text x="604" y="143" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">its own OS layer</text>
  <rect x="336" y="168" width="288" height="44" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="356" y="195" fill="#171717" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sqlite</text>
  <text x="604" y="195" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">its own OS layer</text>
  <text x="336" y="240" fill="#171717" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Update half, switch traffic, zero downtime.</text>
</svg>
