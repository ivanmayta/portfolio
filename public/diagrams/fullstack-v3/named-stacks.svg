<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 312" role="img" aria-labelledby="named-stacks-title named-stacks-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="named-stacks-title">The named stacks, side by side</title>
  <desc id="named-stacks-desc">LAMP, MEAN and MERN mapped onto the same four layers. Each acronym names a different subset, and none of them names all four, which is why the labels carry less meaning than they appear to.</desc>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="16" y="52" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">THE SAME FOUR LAYERS</text>
  <text x="16" y="118" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">user interface</text>
  <text x="16" y="162" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">application</text>
  <text x="16" y="206" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">database</text>
  <text x="16" y="250" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OS + web server</text>
  <text x="232" y="76" fill="#9d4cfa" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.1em" text-anchor="middle">LAMP</text>
  <rect x="160" y="96" width="144" height="36" rx="4" fill="none" stroke="rgba(23,23,23,0.12)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="232" y="119" fill="#c4c4c8" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">—</text>
  <rect x="160" y="140" width="144" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="none"/>
  <text x="232" y="163" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">PHP</text>
  <rect x="160" y="184" width="144" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="none"/>
  <text x="232" y="207" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">MySQL</text>
  <rect x="160" y="228" width="144" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="none"/>
  <text x="232" y="251" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Linux + Apache</text>
  <text x="392" y="76" fill="#171717" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.1em" text-anchor="middle">MEAN</text>
  <rect x="320" y="96" width="144" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="none"/>
  <text x="392" y="119" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Angular</text>
  <rect x="320" y="140" width="144" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="none"/>
  <text x="392" y="163" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Express + Node</text>
  <rect x="320" y="184" width="144" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="none"/>
  <text x="392" y="207" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Mongo</text>
  <rect x="320" y="228" width="144" height="36" rx="4" fill="none" stroke="rgba(23,23,23,0.12)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="392" y="251" fill="#c4c4c8" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">—</text>
  <text x="552" y="76" fill="#171717" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.1em" text-anchor="middle">MERN</text>
  <rect x="480" y="96" width="144" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="none"/>
  <text x="552" y="119" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">React</text>
  <rect x="480" y="140" width="144" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="none"/>
  <text x="552" y="163" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Express + Node</text>
  <rect x="480" y="184" width="144" height="36" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="none"/>
  <text x="552" y="207" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Mongo</text>
  <rect x="480" y="228" width="144" height="36" rx="4" fill="none" stroke="rgba(23,23,23,0.12)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="552" y="251" fill="#c4c4c8" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">—</text>
  <text x="16" y="296" fill="#171717" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">No acronym names all four. They are marketing, not architecture.</text>
</svg>
