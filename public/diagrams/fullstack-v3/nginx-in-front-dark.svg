<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 264" role="img" aria-labelledby="nginx-in-front-dark-title nginx-in-front-dark-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="nginx-in-front-dark-title">Why nginx sits in front</title>
  <desc id="nginx-in-front-dark-desc">Requests arrive from the internet on port 80, reach nginx, and are proxied to a Node process listening on port 3000. Connecting the internet straight to Node is possible but skips everything nginx is good at.</desc>
  <defs>
    <marker id="nginx-in-front-dark-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker>
    <marker id="nginx-in-front-dark-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3f3f46"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0c0c0e"/>
  <path d="M 160 120 L 240 120" stroke="#a1a1aa" stroke-width="1" marker-end="url(#nginx-in-front-dark-a)"/>
  <rect x="176" y="96" width="48" height="14" rx="2" fill="#0c0c0e"/>
  <text x="200" y="107" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">:80</text>
  <path d="M 392 120 L 472 120" stroke="#9d4cfa" stroke-width="1" marker-end="url(#nginx-in-front-dark-a)"/>
  <rect x="384" y="96" width="96" height="14" rx="2" fill="#0c0c0e"/>
  <text x="432" y="107" fill="#9d4cfa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">proxy_pass</text>
  <path d="M 88 152 L 88 192 Q 88 200 96 200 L 544 200 Q 552 200 552 192 L 552 156" fill="none" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#nginx-in-front-dark-b)"/>
  <rect x="232" y="176" width="176" height="14" rx="2" fill="#0c0c0e"/>
  <text x="320" y="187" fill="#3f3f46" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">possible, and a bad idea</text>
  <rect x="16" y="88" width="144" height="64" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="88" y="112" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">the internet</text>
  <text x="88" y="129" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">a request arrives</text>
  <rect x="248" y="88" width="144" height="64" rx="6" fill="rgba(157,76,250,0.14)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="320" y="112" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">nginx</text>
  <text x="320" y="129" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">written in C</text>
  <rect x="480" y="88" width="144" height="64" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="552" y="112" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">your node app</text>
  <text x="552" y="129" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">127.0.0.1:3000</text>
  <text x="16" y="240" fill="#ededed" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">Node can serve the request. nginx can serve it, compress it, cache it and route it.</text>
</svg>
