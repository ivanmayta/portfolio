<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 248" role="img" aria-labelledby="node-response-dark-title node-response-dark-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="node-response-dark-title">What the server sends back</title>
  <desc id="node-response-dark-desc">A response is made of a head carrying the status code and content type, and a body. The index.html file on disk is piped straight into the body and out to the browser rather than being read into memory first.</desc>
  <defs>
    <marker id="node-response-dark-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker>
    <marker id="node-response-dark-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9d4cfa"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0c0c0e"/>
  <rect x="16" y="116" width="136" height="56" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="84" y="141" fill="#ededed" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">index.html</text>
  <text x="84" y="158" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">on disk</text>
  <path d="M 152 144 L 224 144" stroke="#9d4cfa" stroke-width="1" marker-end="url(#node-response-dark-b)"/>
  <rect x="156" y="120" width="64" height="14" rx="2" fill="#0c0c0e"/>
  <text x="188" y="131" fill="#9d4cfa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">.pipe(res)</text>
  <rect x="232" y="48" width="176" height="136" rx="6" fill="none" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="240" y="40" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em">THE RESPONSE</text>
  <rect x="244" y="64" width="152" height="48" rx="4" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="256" y="83" fill="#ededed" font-size="11" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">head</text>
  <text x="256" y="100" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">200 · text/html</text>
  <rect x="244" y="120" width="152" height="48" rx="4" fill="rgba(157,76,250,0.14)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="256" y="139" fill="#ededed" font-size="11" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">body</text>
  <text x="256" y="156" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">streamed through</text>
  <path d="M 408 116 L 480 116" stroke="#a1a1aa" stroke-width="1" marker-end="url(#node-response-dark-a)"/>
  <rect x="416" y="92" width="56" height="14" rx="2" fill="#0c0c0e"/>
  <text x="444" y="103" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">:3000</text>
  <rect x="488" y="88" width="136" height="56" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="556" y="113" fill="#ededed" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">browser</text>
  <text x="556" y="130" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">localhost</text>
  <text x="16" y="222" fill="#ededed" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">The file never lands in memory. It flows through.</text>
</svg>
