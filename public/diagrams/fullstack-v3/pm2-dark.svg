<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 264" role="img" aria-labelledby="pm2-dark-title pm2-dark-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="pm2-dark-title">Why you need a process manager</title>
  <desc id="pm2-dark-desc">Running node directly ties the process to your shell, so closing the terminal or rebooting kills the site. Started under pm2 and saved, the process survives both.</desc>
  <rect width="100%" height="100%" fill="#0c0c0e"/>
  <rect x="16" y="64" width="288" height="152" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="32" y="56" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em">STARTED BY HAND</text>
  <text x="32" y="94" fill="#ededed" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">node app.js</text>
  <text x="32" y="130" fill="#a1a1aa" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif">you close the shell</text>
  <text x="288" y="130" fill="#3f3f46" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">gone</text>
  <text x="32" y="162" fill="#a1a1aa" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif">the server reboots</text>
  <text x="288" y="162" fill="#3f3f46" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">gone</text>
  <text x="32" y="194" fill="#a1a1aa" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif">the app crashes</text>
  <text x="288" y="194" fill="#3f3f46" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">gone</text>
  <rect x="336" y="64" width="288" height="152" rx="6" fill="rgba(157,76,250,0.14)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="352" y="56" fill="#9d4cfa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em">UNDER PM2</text>
  <text x="352" y="94" fill="#ededed" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pm2 start app.js</text>
  <text x="352" y="130" fill="#a1a1aa" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif">you close the shell</text>
  <text x="608" y="130" fill="#9d4cfa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">survives</text>
  <text x="352" y="162" fill="#a1a1aa" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif">the server reboots</text>
  <text x="608" y="162" fill="#9d4cfa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">survives</text>
  <text x="352" y="194" fill="#a1a1aa" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif">the app crashes</text>
  <text x="608" y="194" fill="#9d4cfa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">survives</text>
  <text x="16" y="244" fill="#ededed" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">Reboot only survives after pm2 save and pm2 startup.</text>
</svg>
