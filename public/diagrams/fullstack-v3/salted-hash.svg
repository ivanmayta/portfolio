<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 272" role="img" aria-labelledby="salted-hash-title salted-hash-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="salted-hash-title">What a salt changes</title>
  <desc id="salted-hash-desc">Three people choose the same password, but each record stores a different random salt alongside it. The salted values hash to three unrelated digests, so a precomputed table of common passwords matches none of them.</desc>
  <defs><marker id="salted-hash-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker></defs>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <rect x="256" y="66" width="128" height="148" rx="6" fill="rgba(157,76,250,0.08)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="320" y="134" fill="#171717" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">hash function</text>
  <text x="320" y="152" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">sha256</text>
  <text x="16" y="52" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.12em">THREE PEOPLE, THE SAME PASSWORD</text>
  <rect x="16" y="66" width="192" height="44" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="32" y="84" fill="#171717" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">password</text>
  <text x="32" y="101" fill="#9d4cfa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+ salt a41f9c</text>
  <path d="M 208 88 L 248 88" stroke="#52525b" stroke-width="1" marker-end="url(#salted-hash-a)"/>
  <path d="M 384 88 L 412 88" stroke="#52525b" stroke-width="1" marker-end="url(#salted-hash-a)"/>
  <text x="428" y="92" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ff0552772a7c1…</text>
  <rect x="16" y="118" width="192" height="44" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="32" y="136" fill="#171717" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">password</text>
  <text x="32" y="153" fill="#9d4cfa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+ salt 7b02de</text>
  <path d="M 208 140 L 248 140" stroke="#52525b" stroke-width="1" marker-end="url(#salted-hash-a)"/>
  <path d="M 384 140 L 412 140" stroke="#52525b" stroke-width="1" marker-end="url(#salted-hash-a)"/>
  <text x="428" y="144" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4a0fa10342b3c…</text>
  <rect x="16" y="170" width="192" height="44" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="32" y="188" fill="#171717" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">password</text>
  <text x="32" y="205" fill="#9d4cfa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+ salt e59a13</text>
  <path d="M 208 192 L 248 192" stroke="#52525b" stroke-width="1" marker-end="url(#salted-hash-a)"/>
  <path d="M 384 192 L 412 192" stroke="#52525b" stroke-width="1" marker-end="url(#salted-hash-a)"/>
  <text x="428" y="196" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">c507c4fde750a…</text>
  <text x="16" y="248" fill="#171717" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">One password, three unrelated hashes. There is no table to precompute.</text>
</svg>
