<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 288" role="img" aria-labelledby="shell-config-title shell-config-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="shell-config-title">When your shell config is read</title>
  <desc id="shell-config-desc">Opening a terminal starts a shell, which reads its config file once and runs the lines in it. Editing the file changes nothing until a new terminal opens or the source command re-reads it.</desc>
  <defs>
    <marker id="shell-config-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
    <marker id="shell-config-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9d4cfa"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="16" y="40" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">ONCE, AT STARTUP</text>
  <path d="M 192 108 L 224 108" stroke="#52525b" stroke-width="1" marker-end="url(#shell-config-a)"/>
  <path d="M 408 108 L 440 108" stroke="#52525b" stroke-width="1" marker-end="url(#shell-config-a)"/>
  <path d="M 536 144 L 536 184 Q 536 192 528 192 L 328 192 Q 320 192 320 184 L 320 150" fill="none" stroke="#9d4cfa" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#shell-config-b)"/>
  <rect x="352" y="200" width="152" height="14" rx="2" fill="#fafafa"/>
  <text x="428" y="211" fill="#9d4cfa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">source ~/.zshrc</text>
  <rect x="16" y="72" width="176" height="72" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="104" y="106" fill="#171717" font-size="13" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">you open a terminal</text>
  <text x="104" y="126" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">or a new tab</text>
  <rect x="232" y="72" width="176" height="72" rx="6" fill="rgba(157,76,250,0.08)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="320" y="106" fill="#171717" font-size="13" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">the shell reads its config</text>
  <text x="320" y="126" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">~/.zshrc · ~/.bash_profile</text>
  <rect x="448" y="72" width="176" height="72" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="536" y="106" fill="#171717" font-size="13" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">your line runs</text>
  <text x="536" y="126" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">echo Good morning $USER</text>
  <text x="16" y="262" fill="#171717" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">Edit the file and nothing happens. The shell already read it.</text>
</svg>
