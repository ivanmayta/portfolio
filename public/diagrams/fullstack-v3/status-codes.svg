<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 296" role="img" aria-labelledby="status-codes-title status-codes-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="status-codes-title">Status codes by family</title>
  <desc id="status-codes-desc">Status codes group by their first digit: one is information, two success, three redirect, four a client mistake and five a server failure.</desc>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="16" y="40" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">THE FIRST DIGIT</text>
  <rect x="16" y="60" width="608" height="34" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="44" y="84" fill="#171717" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">1</text>
  <text x="76" y="82" fill="#171717" font-size="11" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">information</text>
  <text x="608" y="82" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">101  switching protocols</text>
  <rect x="16" y="100" width="608" height="34" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="44" y="124" fill="#171717" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">2</text>
  <text x="76" y="122" fill="#171717" font-size="11" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">success</text>
  <text x="608" y="122" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">200  ok      ·  201  created</text>
  <rect x="16" y="140" width="608" height="34" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="44" y="164" fill="#171717" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">3</text>
  <text x="76" y="162" fill="#171717" font-size="11" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">redirect</text>
  <text x="608" y="162" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">301  permanent  ·  302  temporary</text>
  <rect x="16" y="180" width="608" height="34" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="44" y="204" fill="#171717" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">4</text>
  <text x="76" y="202" fill="#171717" font-size="11" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">you got it wrong</text>
  <text x="608" y="202" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">401  unauthorised  ·  404  not found</text>
  <rect x="16" y="220" width="608" height="34" rx="4" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="44" y="244" fill="#171717" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">5</text>
  <text x="76" y="242" fill="#171717" font-size="11" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">the server got it wrong</text>
  <text x="608" y="242" fill="#52525b" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">500  error  ·  502  bad gateway</text>
  <text x="16" y="284" fill="#9d4cfa" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">You never need to recall 401 against 403. You need to know that 4 is you.</text>
</svg>
