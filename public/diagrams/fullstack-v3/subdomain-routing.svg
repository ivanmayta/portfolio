<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 264" role="img" aria-labelledby="subdomain-routing-title subdomain-routing-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="subdomain-routing-title">How nginx tells subdomains apart</title>
  <desc id="subdomain-routing-desc">Two hostnames arrive at the same IP address. nginx matches each against the server_name in its server blocks and proxies them to different applications on different ports.</desc>
  <defs><marker id="subdomain-routing-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker></defs>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <path d="M 176 92 L 200 92 Q 208 92 208 100 L 208 112 Q 208 120 216 120 L 232 120" fill="none" stroke="#52525b" stroke-width="1" marker-end="url(#subdomain-routing-a)"/>
  <path d="M 176 180 L 200 180 Q 208 180 208 172 L 208 160 Q 208 152 216 152 L 232 152" fill="none" stroke="#52525b" stroke-width="1" marker-end="url(#subdomain-routing-a)"/>
  <path d="M 384 120 L 400 120 Q 408 120 408 112 L 408 100 Q 408 92 416 92 L 440 92" fill="none" stroke="#52525b" stroke-width="1" marker-end="url(#subdomain-routing-a)"/>
  <path d="M 384 152 L 400 152 Q 408 152 408 160 L 408 172 Q 408 180 416 180 L 440 180" fill="none" stroke="#52525b" stroke-width="1" marker-end="url(#subdomain-routing-a)"/>
  <rect x="16" y="64" width="160" height="56" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="96" y="88" fill="#171717" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">jemstack.lol</text>
  <text x="96" y="105" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">the apex</text>
  <rect x="16" y="152" width="160" height="56" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="96" y="176" fill="#171717" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">blog.jemstack.lol</text>
  <text x="96" y="193" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">an A record too</text>
  <rect x="232" y="96" width="152" height="80" rx="6" fill="rgba(157,76,250,0.08)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="308" y="120" fill="#171717" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">nginx</text>
  <text x="308" y="137" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">matches server_name</text>
  <rect x="440" y="64" width="184" height="56" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="532" y="88" fill="#171717" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">node</text>
  <text x="532" y="105" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">127.0.0.1:3000</text>
  <rect x="440" y="152" width="184" height="56" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="532" y="176" fill="#171717" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">anything else</text>
  <text x="532" y="193" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">a different port</text>
  <text x="16" y="244" fill="#171717" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">One IP, one machine, as many applications as you want.</text>
</svg>
