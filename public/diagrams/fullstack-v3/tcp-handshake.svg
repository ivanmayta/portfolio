<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 312" role="img" aria-labelledby="tcp-handshake-title tcp-handshake-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="tcp-handshake-title">The TCP handshake</title>
  <desc id="tcp-handshake-desc">Before any data moves, the client sends SYN, the server replies SYN-ACK, and the client answers ACK. Only after that three-step agreement does the real transfer begin.</desc>
  <defs><marker id="tcp-handshake-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker></defs>
  <rect width="100%" height="100%" fill="#fafafa"/>
  <rect x="16" y="40" width="144" height="48" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="88" y="64" fill="#171717" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">you</text>
  <text x="88" y="81" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">client</text>
  <rect x="480" y="40" width="144" height="48" rx="6" fill="#f2f2f3" stroke="#d4d4d8" stroke-width="1"/>
  <text x="552" y="64" fill="#171717" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">the server</text>
  <text x="552" y="81" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">listening</text>
  <path d="M 88 88 L 88 268" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <path d="M 552 88 L 552 268" stroke="rgba(23,23,23,0.12)" stroke-width="1"/>
  <path d="M 88 120 L 544 120" stroke="#52525b" stroke-width="1" marker-end="url(#tcp-handshake-a)"/>
  <rect x="180" y="98" width="280" height="15" rx="2" fill="#fafafa"/>
  <text x="200" y="110" fill="#9d4cfa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SYN</text>
  <text x="264" y="110" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">I want to send you something</text>
  <path d="M 552 164 L 96 164" stroke="#52525b" stroke-width="1" marker-end="url(#tcp-handshake-a)"/>
  <rect x="180" y="142" width="280" height="15" rx="2" fill="#fafafa"/>
  <text x="200" y="154" fill="#9d4cfa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SYN-ACK</text>
  <text x="264" y="154" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">heard you, go ahead</text>
  <path d="M 88 208 L 544 208" stroke="#52525b" stroke-width="1" marker-end="url(#tcp-handshake-a)"/>
  <rect x="180" y="186" width="280" height="15" rx="2" fill="#fafafa"/>
  <text x="200" y="198" fill="#9d4cfa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ACK</text>
  <text x="264" y="198" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">heard that you heard me</text>
  <path d="M 88 252 L 544 252" stroke="#52525b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#tcp-handshake-a)"/>
  <rect x="212" y="230" width="216" height="15" rx="2" fill="#fafafa"/>
  <text x="320" y="242" fill="#52525b" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">…and only now, the actual data</text>
  <text x="16" y="292" fill="#171717" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">Three messages of paperwork, millions of times a day. UDP skips all of it.</text>
</svg>
