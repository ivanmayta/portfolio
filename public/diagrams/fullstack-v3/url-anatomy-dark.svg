<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 176" role="img" aria-labelledby="url-anatomy-dark-title url-anatomy-dark-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="url-anatomy-dark-title">The parts of a URL</title>
  <desc id="url-anatomy-dark-desc">A URL broken into protocol, subdomain, domain, top level domain, path and query parameters, with the domain and top level domain marked as the part you actually buy.</desc>
  <rect width="100%" height="100%" fill="#0c0c0e"/>
  <text x="120" y="52" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">UNIFORM RESOURCE LOCATOR</text>
  <text x="120" y="84" fill="#ededed" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0">https://dev.example.com/posts/vim?sort=new</text>
  <path d="M 158 94 L 158 110" stroke="rgba(237,237,237,0.12)" stroke-width="1"/>
  <text x="158" y="124" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">protocol</text>
  <path d="M 216 94 L 216 110" stroke="rgba(237,237,237,0.12)" stroke-width="1"/>
  <text x="216" y="124" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">subdomain</text>
  <path d="M 268 94 L 268 110" stroke="rgba(237,237,237,0.12)" stroke-width="1"/>
  <text x="268" y="124" fill="#9d4cfa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">domain</text>
  <path d="M 321 94 L 321 110" stroke="rgba(237,237,237,0.12)" stroke-width="1"/>
  <text x="321" y="124" fill="#9d4cfa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">TLD</text>
  <path d="M 388 94 L 388 110" stroke="rgba(237,237,237,0.12)" stroke-width="1"/>
  <text x="388" y="124" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">path</text>
  <path d="M 480 94 L 480 110" stroke="rgba(237,237,237,0.12)" stroke-width="1"/>
  <text x="480" y="124" fill="#a1a1aa" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">query</text>
  <text x="120" y="158" fill="#ededed" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">You buy the two in colour. The rest you decide yourself.</text>
</svg>
