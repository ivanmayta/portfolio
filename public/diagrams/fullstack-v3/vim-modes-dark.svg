<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 264" role="img" aria-labelledby="vim-modes-dark-title vim-modes-dark-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="vim-modes-dark-title">The three modes of Vim</title>
  <desc id="vim-modes-dark-desc">Normal mode sits in the middle and is where Vim opens. Pressing i moves to insert mode for typing and Escape comes back; pressing colon moves to command mode for saving and quitting and Escape comes back.</desc>
  <defs><marker id="vim-modes-dark-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#a1a1aa"/></marker></defs>
  <rect width="100%" height="100%" fill="#0c0c0e"/>
  <text x="16" y="40" fill="#71717a" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">VIM OPENS IN NORMAL MODE</text>
  <path d="M 240 112 L 180 112" stroke="#a1a1aa" stroke-width="1" marker-end="url(#vim-modes-dark-a)"/>
  <rect x="194" y="92" width="32" height="12" rx="2" fill="#0c0c0e"/>
  <text x="210" y="101" fill="#ededed" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">i</text>
  <path d="M 176 152 L 236 152" stroke="#a1a1aa" stroke-width="1" marker-end="url(#vim-modes-dark-a)"/>
  <rect x="189" y="132" width="35" height="12" rx="2" fill="#0c0c0e"/>
  <text x="206" y="141" fill="#ededed" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ESC</text>
  <path d="M 400 112 L 460 112" stroke="#a1a1aa" stroke-width="1" marker-end="url(#vim-modes-dark-a)"/>
  <rect x="414" y="92" width="32" height="12" rx="2" fill="#0c0c0e"/>
  <text x="430" y="101" fill="#ededed" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">:</text>
  <path d="M 464 152 L 404 152" stroke="#a1a1aa" stroke-width="1" marker-end="url(#vim-modes-dark-a)"/>
  <rect x="417" y="132" width="35" height="12" rx="2" fill="#0c0c0e"/>
  <text x="434" y="141" fill="#ededed" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ESC</text>
  <rect x="16" y="96" width="160" height="72" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="96" y="130" fill="#ededed" font-size="14" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">insert</text>
  <text x="96" y="150" fill="#a1a1aa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">typing text</text>
  <rect x="240" y="96" width="160" height="72" rx="6" fill="rgba(157,76,250,0.14)" stroke="#9d4cfa" stroke-width="1.2"/>
  <text x="320" y="130" fill="#ededed" font-size="14" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">normal</text>
  <text x="320" y="150" fill="#a1a1aa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">where you land</text>
  <rect x="464" y="96" width="160" height="72" rx="6" fill="#141416" stroke="rgba(161,161,170,0.28)" stroke-width="1"/>
  <text x="544" y="130" fill="#ededed" font-size="14" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">command</text>
  <text x="544" y="150" fill="#a1a1aa" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">save, quit, search</text>
  <text x="16" y="230" fill="#ededed" font-size="15" font-style="italic" font-family="Georgia, Times New Roman, serif">Lost? ESC gets you to normal from anywhere. Then :wq writes and quits.</text>
</svg>
